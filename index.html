<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sea Train</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d3eced; }
    canvas { display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #hud {
      position: fixed; left: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center;
      font: 14px/1.3 system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px rgb(0 0 0 / 0.35);
    }
    button {
      font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 999px;
      background: rgb(255 255 255 / 0.9); color: #0b7cb9; cursor: pointer;
    }
    button.quiet { background: rgb(255 255 255 / 0.55); color: #0b5f8f; }
    [hidden] { display: none !important; }
    #paused {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: rgb(11 95 143 / 0.25); font: 16px/1.4 system-ui, sans-serif;
    }
    #paused > div {
      background: rgb(255 255 255 / 0.92); color: #0b5f8f; padding: 24px 28px; border-radius: 20px;
      text-align: center; margin: 16px;
    }
    #paused h2 { margin: 0 0 6px; }
    #paused p { margin: 0 0 16px; }
    #paused .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    #paused button { background: #0b7cb9; color: #fff; }
    #paused button.quiet { background: #e3eef4; color: #0b5f8f; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <button id="enter-vr" hidden>Enter VR</button>
    <button id="quit" class="quiet">Quit</button>
    <span>Drag to look around · in VR, hold B or Y to exit · palette: <b id="palette-name"></b></span>
  </div>
  <div id="paused" hidden>
    <div>
      <h2>Ride paused</h2>
      <p>Everything is stopped until you carry on.</p>
      <div class="row">
        <button id="resume-vr" hidden>Back to VR</button>
        <button id="resume-here" class="quiet">Watch here</button>
        <button id="quit-paused" class="quiet">Quit</button>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
