name: Test (emulated Quest)

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no browser builds for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots
