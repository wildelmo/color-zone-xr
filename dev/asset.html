<html><head><meta charset="utf-8"><title>asset lab</title>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>

<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CATALOG } from '../library/index.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();

scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;

c.skipAssembly();
c.wind(1);
if (q.has('shake')) c.shake?.(1);
const T = +(q.get('t') || 3);
for (let i = 0; i < T * 30; i++) c.update(1 / 30, { cameraLocal: cam.position.clone(), worldScale: c.info.scale });
renderer.render(scene, cam);
renderer.render(scene, cam);
let tris = 0, calls = renderer.info.render.calls; tris = renderer.info.render.triangles;
renderer.render(scene, cam);

const vis = []; c.root.traverse((o) => { if (o.isMesh || o.isGroup) { let v = o; let ok = true; while (v) { if (!v.visible) ok = false; v = v.parent; } if (!ok) vis.push('HIDDEN ' + o.name); } });
const isl = c.root.getObjectByName('island'); const bb = new THREE.Box3().setFromObject(c.root.getObjectByName('globe:base'));
window.__dbg = { hidden: vis.slice(0, 10), islandY: isl.position.y, islandVisible: isl.visible, baseBox: [bb.min.toArray().map(Math.round), bb.max.toArray().map(Math.round)], baseColors: !!c.root.getObjectByName('globe:base').geometry.attributes.color, rootScale: c.root.scale.x };
const per = [];
c.root.traverse((o) => { if (o.isMesh && o.visible) { const n = (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; const inst = o.isInstancedMesh ? o.count : 1; per.push([o.name, Math.round(n), inst, Math.round(n * inst)]); if (o.geometry.boundingSphere && isNaN(o.geometry.boundingSphere.radius)) per.push(['NAN', o.name]); } });
per.sort((a, b) => b[3] - a[3]);
window.__done.per = per.slice(0, 18); let meshes = 0, bulbs = 0; c.root.traverse((o) => { if (o.isMesh && o.visible && (!o.isInstancedMesh || o.count > 0)) meshes++; if (o.name === 'bulbs:glass') bulbs += o.count; }); window.__done.meshes = meshes; window.__done.bulbs = bulbs; window.__done.nan = per.filter((x) => x[0] === 'NAN');

renderer.render(scene, cam);
</script></body></html>
