<html><head><meta charset="utf-8"><title>carousel lab</title>

<style>html,body{margin:0;height:100%;background:#222}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createCarousel } from '../library/carousel/index.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x231c18);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 35), innerWidth / innerHeight, 0.05, 200);
const yaw = +(q.get('yaw') || 0.3), pitch = +(q.get('pitch') || 0.12), dist = +(q.get('dist') || 26);
const ty = +(q.get('ty') || 4.8);
cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
cam.lookAt(+(q.get('tx') || 0), ty, +(q.get('tz') || 0));

dl.shadow.mapSize.set(2048, 2048); Object.assign(dl.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 }); dl.shadow.bias = -0.0005; dl.shadow.normalBias = 0.02;
scene.add(dl);
const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x4a1a1a, roughness: 0.9 }));
floor.receiveShadow = true; scene.add(floor);
const t0 = performance.now();
const ctx = { step: () => new Promise((r) => setTimeout(r, 0)), progress: (f, l) => console.log('progress', f, l) };
const c = await createCarousel(ctx, { lod: q.get('lod') || 'hero' });
scene.add(c.root);
c.skipAssembly();
c.wind(1);
const T = +(q.get('t') || 3);
for (let i = 0; i < T * 30; i++) c.update(1 / 30, { cameraLocal: cam.position.clone(), worldScale: 1 / 25 });
renderer.render(scene, cam);
renderer.render(scene, cam);
let tris = 0, calls = renderer.info.render.calls; tris = renderer.info.render.triangles;
window.__done = { ms: Math.round(performance.now() - t0), calls, tris, horseTris: c.stats.horseTris };
window.__c = c;
const per = [];
c.root.traverse((o) => { if (o.isMesh && o.visible) { const n = (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; const inst = o.isInstancedMesh ? o.count : 1; per.push([o.name, Math.round(n), inst, Math.round(n * inst)]); if (o.geometry.boundingSphere && isNaN(o.geometry.boundingSphere.radius)) per.push(['NAN', o.name]); } });
per.sort((a, b) => b[3] - a[3]);
window.__done.per = per.slice(0, 18); let meshes = 0, bulbs = 0; c.root.traverse((o) => { if (o.isMesh && o.visible && (!o.isInstancedMesh || o.count > 0)) meshes++; if (o.name === 'bulbs:glass') bulbs += o.count; }); window.__done.meshes = meshes; window.__done.bulbs = bulbs; window.__done.nan = per.filter((x) => x[0] === 'NAN');
</script></body></html>
